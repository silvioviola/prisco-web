# ============================================================
#  Panel de carga (Sveltia CMS) — PRISCO Automotores
#  Cambiá "TU-USUARIO" por tu usuario/organización de GitHub.
# ============================================================
backend:
  name: github
  repo: silvioviola/prisco-web
  branch: main
  base_url: https://sveltia-cms-auth.silvioalberto.workers.dev

# Permite editar en tu compu antes de publicar en vivo.
# Corré `npx @sveltia/cms-proxy-server` y entrá a http://localhost:4321/admin/
local_backend: true

# Carpeta donde se guardan las fotos que suba el dueño.
media_folder: 'public/uploads/autos'
public_folder: '/uploads/autos'

# Idioma del panel
locale: 'es'

collections:
  - name: 'autos'
    label: 'Autos'
    label_singular: 'Auto'
    description: 'Cargá, editá o marcá como vendido cada vehículo.'
    folder: 'src/content/autos'
    create: true
    identifier_field: 'modelo'
    slug: '{{fields.marca}}-{{fields.modelo}}-{{fields.anio}}-{{hour}}{{minute}}{{second}}'
    extension: 'md'
    format: 'frontmatter'
    summary: '{{fields.marca}} {{fields.modelo}} {{fields.anio}} — {{fields.estado}}'
    sortable_fields: ['orden', 'anio', 'precio', 'marca']
    fields:
      - { label: 'Marca', name: 'marca', widget: 'string' }
      - { label: 'Modelo', name: 'modelo', widget: 'string' }
      - { label: 'Versión', name: 'version', widget: 'string', required: false, hint: 'Ej: 2.8 SRX 4x4' }
      - { label: 'Año', name: 'anio', widget: 'number', value_type: 'int', min: 1980, max: 2027 }
      - { label: 'Kilómetros', name: 'km', widget: 'number', value_type: 'int', default: 0 }
      - { label: 'Precio', name: 'precio', widget: 'number', value_type: 'int', hint: 'Sin puntos ni símbolos. Ej: 45900' }
      - { label: 'Moneda', name: 'moneda', widget: 'select', options: ['ARS', 'USD'], default: 'ARS' }
      - { label: 'Cuota desde (opcional)', name: 'cuotaDesde', widget: 'number', value_type: 'int', required: false, hint: 'Valor de la cuota en pesos, si aplica' }
      - { label: 'Transmisión', name: 'transmision', widget: 'select', options: ['Manual', 'Automática'], default: 'Manual' }
      - { label: 'Combustible', name: 'combustible', widget: 'select', options: ['Nafta', 'Diésel', 'GNC', 'Híbrido', 'Eléctrico'], default: 'Nafta' }
      - { label: 'Color', name: 'color', widget: 'string', required: false }
      - { label: 'Tipo', name: 'segmento', widget: 'select', options: ['Usado', '0km'], default: 'Usado' }
      - { label: 'Estado', name: 'estado', widget: 'select', options: ['Disponible', 'Reservado', 'Vendido'], default: 'Disponible', hint: 'Vendido muestra un cartel verde pero el auto SIGUE en la web. Para sacarlo del todo, apagá "Publicado en la web".' }
      - { label: 'Publicado en la web', name: 'publicado', widget: 'boolean', default: true, hint: 'Encendido = el auto se ve en la web. Apagalo para BAJAR el auto de la web.' }
      - { label: '¿Destacado?', name: 'destacado', widget: 'boolean', default: false, hint: 'Aparece primero y en la portada' }
      - { label: '¿Acepta permuta?', name: 'permuta', widget: 'boolean', default: true }
      - { label: '¿Financiación?', name: 'financiacion', widget: 'boolean', default: true }
      - { label: '¿En consignación?', name: 'consignacion', widget: 'boolean', default: false }
      - { label: 'Orden', name: 'orden', widget: 'number', value_type: 'int', required: false, default: 0, hint: 'Menor número aparece primero' }
      - { label: 'Fecha de ingreso', name: 'fechaIngreso', widget: 'datetime', required: false, date_format: 'DD-MM-YYYY', time_format: false }
      - label: 'Fotos'
        name: 'fotos'
        widget: 'list'
        summary: '{{fields.image}}'
        field: { label: 'Foto', name: 'image', widget: 'image' }
        hint: 'La primera foto es la portada. Arrastrá para reordenar.'
      - { label: 'Descripción', name: 'body', widget: 'markdown', required: false }
