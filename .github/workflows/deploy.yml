name: Publicar en DonWeb

# Se ejecuta al guardar cambios en la rama principal (main)
# o manualmente desde la pestaña "Actions" de GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1) Traer el código del repositorio
      - name: Descargar código
        uses: actions/checkout@v4

      # 2) Preparar Node.js
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3) Instalar dependencias y construir la web (genera la carpeta dist/)
      - name: Instalar y construir
        run: |
          npm ci
          npm run build

      # 4) Subir la web ya construida a DonWeb por FTPS (con lftp, robusto ante el canal de datos)
      - name: Subir por FTPS a DonWeb
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -e "set ftp:ssl-allow true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ftp:ssl-protect-list true; set ssl:verify-certificate no; set ftp:passive-mode true; set net:timeout 20; set net:max-retries 3; set net:persist-retries 3; open \"$FTP_SERVER\"; user \"$FTP_USERNAME\" \"$FTP_PASSWORD\"; mirror -R --verbose --parallel=1 ./dist/ \"$FTP_REMOTE_DIR\"; bye"
