name: Publicar en DonWeb

# Se ejecuta al guardar cambios en la rama principal (main)
# o manualmente desde la pestaña "Actions" de GitHub.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1) Traer el código del repositorio
      - name: Descargar código
        uses: actions/checkout@v4

      # 2) Preparar Node.js
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3) Instalar dependencias y construir la web (genera la carpeta dist/)
      - name: Instalar y construir
        run: |
          npm ci
          npm run build

      # 4) Subir la web ya construida a DonWeb por FTP
      - name: Subir por FTP a DonWeb
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}
